$kind: http-request
description: "Tu URL original. Devuelve items vacío: tras filtrar queda 1 producto (total = 1) y saltar=5 se lo salta."
url: "{{base_url}}/products?categoria=ropa&con_stock=true&precio_max=120&saltar=5&limite=10"
method: GET
queryParams:
  categoria: ropa
  con_stock: "true"
  precio_max: "120"
  saltar: "5"
  limite: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("total = 1", () => pm.expect(body.total).to.eql(1));
      pm.test("items vacío porque saltar=5", () => pm.expect(body.items).to.have.lengthOf(0));
    language: text/javascript
order: 3000
