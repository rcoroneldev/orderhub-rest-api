$kind: http-request
url: "{{base_url}}/products"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      pm.test("Hay 5 productos", () => pm.expect(pm.response.json().total).to.eql(5));
    language: text/javascript
order: 1000
