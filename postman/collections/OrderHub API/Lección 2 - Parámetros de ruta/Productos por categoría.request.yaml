$kind: http-request
description: "Valores permitidos (Enum): ropa, electronica, hogar."
url: "{{base_url}}/categorias/:categoria"
method: GET
pathVariables:
  categoria: ropa
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const categoria = pm.request.url.variables.get("categoria") || pm.request.url.path[1];
      pm.test("Todos son de la categoría pedida", () => body.productos.forEach(
        p => pm.expect(p.categoria).to.eql(categoria)));
    language: text/javascript
order: 5000
