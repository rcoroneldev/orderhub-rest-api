$kind: http-request
name: "8. Error: producto inexistente (RFC 7807)"
url: "{{base_url}}/api/v1/products/{{product_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 404", () => pm.response.to.have.status(404));
      pm.test("Formato problem+json", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("application/problem+json"));
      pm.test("Explica el error", () => pm.expect(pm.response.json().detail).to.include("no existe"));
    language: text/javascript
order: 8000
