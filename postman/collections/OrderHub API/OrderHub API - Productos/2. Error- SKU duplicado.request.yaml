$kind: http-request
name: "2. Error: SKU duplicado"
url: "{{base_url}}/api/v1/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sku": "{{sku}}",
      "name": "Otro polo",
      "price": "10.00"
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 409 - el SKU ya existe", () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
