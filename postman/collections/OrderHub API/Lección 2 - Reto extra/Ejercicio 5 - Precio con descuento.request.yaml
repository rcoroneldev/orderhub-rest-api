$kind: http-request
description: |-
  Crea GET /products/{product_id}/descuento/{porcentaje} que devuelva
  {"precio_original": ..., "porcentaje": ..., "precio_final": ...}, con precio_final redondeado a 2 decimales.

  El porcentaje debe estar entre 1 y 90. Concepto nuevo: Path(), que funciona como el Query() de la lección 3 pero para parámetros de ruta:
      from fastapi import Path
      porcentaje: int = Path(ge=1, le=90)
url: "{{base_url}}/products/:product_id/descuento/:porcentaje"
method: GET
pathVariables:
  product_id: "1"
  porcentaje: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Precio original 39.9", () => pm.expect(body.precio_original).to.eql(39.9));
      pm.test("Precio final 35.91 (10% menos)", () => pm.expect(body.precio_final).to.be.closeTo(35.91, 0.001));
    language: text/javascript
order: 8000
