$kind: http-request
description: El producto 2 existe, pero es de electrónica, no de ropa.
url: "{{base_url}}/categorias/:categoria/products/:product_id"
method: GET
pathVariables:
  categoria: ropa
  product_id: "2"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", () => pm.response.to.have.status(200));
      pm.test("Devuelve un mensaje de error", () => pm.expect(pm.response.json()).to.have.property("error"));
    language: text/javascript
order: 7000
